name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p native --all-targets -- -D warnings
      - name: Clippy (napi addon)
        run: cargo clippy -p native --lib --features napi-addon -- -D warnings
      - name: Check
        run: cargo check -p native
      - name: Check napi addon
        run: cargo check -p native --lib --features napi-addon
      - name: Test
        run: cargo test -p native
      - name: Fuse-free session graph
        run: |
          set -euo pipefail
          assert_absent() {
            local tree
            tree="$(cargo tree -p native "$@" -e normal --prefix none -f '{p}')" || exit 1
            if printf '%s\n' "$tree" | grep -E '^(fuser|ratarmount-fuse|ratarmount-nfs|ratarmount-smb|ratarmount-http)($| )' >/dev/null; then
              echo "banned crate in graph" >&2
              exit 1
            fi
          }
          assert_absent
          assert_absent --features napi-addon
      - name: Self-test
        run: cargo run -p native -- --self-test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install
        run: bun install --frozen-lockfile
        working-directory: app
      - name: No conflict markers
        run: |
          if git grep -nE '^<<<<<<<' -- ':!*.lock' ':!**/bun.lock' .; then
            echo "git conflict markers in the tree" >&2
            exit 1
          fi
      - name: Typecheck
        run: bun run typecheck
        working-directory: app
      - name: Test
        run: bun test
        working-directory: app
